[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hspf"
urls = { "Homepage" = "https://github.com/mfratkin1/pyHSPF" }  # ? Add this!
version = "2.2.1"
dependencies = [
  "pandas",
  "requests",
  "networkx",
  "numba",
  "tables",
  "numpy",
  "duckdb",
  "pyarrow",
  "xarray"
]
requires-python = ">=3.8"
authors = [
  {name = "Mulu Fratkin", email = "michael.fratkin@state.mn.us"},
]
maintainers = [
  {name = "Mulu Fratkin", email = "michael.fratkin@state.mn.us"},
]
description = "Python package for downloading and running HSPF models"
license = "MIT"
license-files = ["LICEN[CS]E.*"]
keywords = ["HSPF","Hydrology"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python"
]

[project.optional-dependencies]
docs = ["sphinx>=7.0", "sphinx-rtd-theme"]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not requires_engine"]
markers = [
  "model_data: requires committed HSPF fixture models under tests/data/models",
  "requires_engine: requires running the WinHSPF executable; excluded by default",
]
norecursedirs = ["tests/data/models"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/tests/data/models",
]